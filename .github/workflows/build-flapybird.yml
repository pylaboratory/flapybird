name: Build FlapyBird Executable

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce pyinstaller
      - name: Build executable
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            pyinstaller --windowed --add-data "flappy-bird-assets:flappy-bird-assets" main.py
          elif [ "${{ runner.os }}" = "Windows" ]; then
            pyinstaller --onefile --windowed --add-data "flappy-bird-assets;flappy-bird-assets" main.py
          else
            pyinstaller --onefile --windowed --add-data "flappy-bird-assets:flappy-bird-assets" main.py
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flapybird-${{ runner.os }}
          path: dist/
